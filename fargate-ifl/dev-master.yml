        DesiredCount: !Ref 'DesiredCount'
        HealthPath: /actuator/health
        HttpHostHeader: !Sub "devapilms.${DomainName}"
        HTTPSListener: !GetAtt VPC.Outputs.HTTPSlistener
        PrivateNamespace: !GetAtt Discovery.Outputs.PrivateNamespace
        PublicLoadBalancer: !GetAtt VPC.Outputs.PublicLoadBalancer  
        EnvironmentFile1: !Sub ${EnvironmentFilePath}/lms-service.env
        EnvironmentFile2: !Sub ${EnvironmentFilePath}/backend-common.env
        EnvironmentFile3: !Sub ${EnvironmentFilePath}/credentials.env            
        LaunchType: FARGATE
        LogRetentionInDays: !Ref LogRetentionInDays
        NetworkMode: awsvpc    #bridge | host | awsvpc | none 

  SchedularService:
    DependsOn: VPC
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub ${AWSBucketUrl}/cloudformation/service.yml
      Parameters:
        StackName: !Ref AWS::StackName
        ServiceName: schedular-service
        ImageUrl: !Sub ${ECRRepoUrl}/schedular-service:latest
        ContainerPort: 9008
        ContainerCpu: 256
        ContainerMemory: 512
        Path: "*"
        Priority: 7
        DesiredCount: !Ref 'DesiredCount'
        HealthPath: /actuator/health
        HttpHostHeader: !Sub "devapischedular.${DomainName}"
        HTTPSListener: !GetAtt VPC.Outputs.HTTPSlistener
        PrivateNamespace: !GetAtt Discovery.Outputs.PrivateNamespace
        PublicLoadBalancer: !GetAtt VPC.Outputs.PublicLoadBalancer 
        EnvironmentFile1: !Sub ${EnvironmentFilePath}/schedular-service.env
        EnvironmentFile2: !Sub ${EnvironmentFilePath}/backend-common.env
        EnvironmentFile3: !Sub ${EnvironmentFilePath}/credentials.env           
        LaunchType: FARGATE
        LogRetentionInDays: !Ref LogRetentionInDays
        NetworkMode: awsvpc    #bridge | host | awsvpc | none 

  LosService:
    DependsOn: VPC
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub ${AWSBucketUrl}/cloudformation/service.yml
      Parameters:
        StackName: !Ref AWS::StackName
        ServiceName: los-service
        ImageUrl: !Sub ${ECRRepoUrl}/los-service:latest
        ContainerPort: 9005
