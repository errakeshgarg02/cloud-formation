AWSTemplateFormatVersion: '2010-09-09'
Description: Deploy a payment processing service on AWS Fargate, hosted in a private subnet, but accessible via a public load balancer.


Parameters:
  StackName:
    Type: String
    Default: dev
    Description: The name of the parent Fargate networking stack that you created. Necessary
                 to locate and reference resources created by that stack.
  ServiceName:
    Type: String
    Default: payment-processing-service
    Description: A name for the service
  ImageUrl:
    Type: String
    Default: nginx
    Description: The url of a docker image that contains the application process that
                 will handle the traffic for this service
  ContainerPort:
    Type: Number
    Default: 9011
    Description: What port number the application inside the docker container is binding to
  ContainerCpu:
    Type: Number
    Default: 256
    Description: How much CPU to give the container. 1024 is 1 CPU
  ContainerMemory:
    Type: Number
    Default: 1024
    Description: How much memory in megabytes to give the container
  Path:
    Type: String
    Default: "*"
    Description: A path on the public load balancer that this service
                 should be connected to. Use * to send all load balancer
                 traffic to this service.

  HttpHostHeader:
    Type: String
    Default: dev-lsp-pps.jsinfosys.co.in
    Description: A http host header.

  Priority:
    Type: Number
    Default: 13
    Description: The priority for the routing rule added to the load balancer.
                 This only applies if your have multiple services which have been
                 assigned to different paths on the load balancer.
  DesiredCount:
    Type: Number
    Default: 1
    Description: How many copies of the service task to run

  Role:
    Type: String
    Default: ""
    Description: (Optional) An IAM role to give the service's containers if the code within needs to
                 access other AWS resources like S3 buckets, DynamoDB tables, etc

  HealthPath:
    Type: String
    Default: "/actuator/health"
    Description: Health check path for target group

  PrivateNamespace:
    Type: String
    Default: "ns-p54r6pzlscnexsou"
    Description: Private Namespace for Service discovery 

  PublicLoadBalancer:
    Type: String
    Default: arn:aws:elasticloadbalancing:ap-south-1:039612852714:loadbalancer/app/dev-alb/1d734e2d65035bd6
    Description: Public Load Balancer 

  HTTPSListener:
    Type: String
    Default: arn:aws:elasticloadbalancing:ap-south-1:039612852714:listener/app/dev-alb/1d734e2d65035bd6/272ce9dcc7875442
    Description: A Https Listener
  
  NetworkMode:
    Type: String
    Default: awsvpc
    Description: Task Definition Network Mode
  
  EnvironmentFile1:
    Type: String
    Default: arn:aws:s3:::pl-infra/service-data/dev/backend-common.env
    Description: The Environment file 1

  EnvironmentFile2:
    Type: String
    Default: arn:aws:s3:::pl-infra/service-data/dev/credentials.env
    Description: The Environment file 2

  EnvironmentFile3:
    Type: String
    Default: arn:aws:s3:::pl-infra/service-data/dev/payment-processing-service.env
    Description: The Environment file 3    

  LaunchType:
    Type: String
    Default: "FARGATE"
    Description: The Service launch type 

  LogRetentionInDays:
    Type: Number
    Default: 90
    Description: The Service Cloudwatch logs retention

  TargetType:
    Type: String
    Default: ip
    Description: The target type for service and alb       


Conditions:
  HasCustomRole: !Not [ !Equals [!Ref 'Role', ''] ]

Resources:

  # The task definition. This is a simple metadata description of what
  # container to run, and what resource requirements it has.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Tags: 
        - Key: Name
          Value: !Sub "${StackName} ${ServiceName}" 
      Family: !Sub "${StackName}-${ServiceName}"
      Cpu: !Ref 'ContainerCpu'
      Memory: !Ref 'ContainerMemory'
      NetworkMode: !Ref 'NetworkMode'
      RequiresCompatibilities:
        - FARGATE
        - EC2
      ExecutionRoleArn:
        Fn::ImportValue:
          !Join [':', [!Ref 'StackName', 'ECSTaskExecutionRole']]
      TaskRoleArn:
        Fn::If:
          - 'HasCustomRole'
          - !Ref 'Role'
          - !Ref "AWS::NoValue"
      ContainerDefinitions:
        - Name: !Ref 'ServiceName'
          Cpu: !Ref 'ContainerCpu'
          Memory: !Ref 'ContainerMemory'
          MemoryReservation: 256
          Essential: true
          Image: !Ref 'ImageUrl'
          PortMappings:
            - ContainerPort: !Ref 'ContainerPort'
              Protocol: tcp
          EnvironmentFiles: 
            - Type: s3
              Value: !Ref EnvironmentFile1
            - Type: s3
              Value: !Ref EnvironmentFile2
            - Type: s3
              Value: !Ref EnvironmentFile3
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogsGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: 'ecs'            

  CloudWatchLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "${StackName}-${ServiceName}"
      RetentionInDays: !Ref 'LogRetentionInDays'

  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties: 
      Description: !Sub 'Discovery Service for ${StackName}'
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - TTL: 60
            Type: A
          - TTL: 60
            Type: SRV
      HealthCheckCustomConfig: 
        FailureThreshold: 1
      Name: !Ref 'ServiceName'
      NamespaceId: !Ref PrivateNamespace      

  # The service. The service is a resource which allows you to run multiple
  # copies of a type of task, and gather up their logs and metrics, as well
  # as monitor the number of running tasks and replace any that have crashed
  Service:
    Type: AWS::ECS::Service
    DependsOn: 
      - LoadBalancerRule
      - DiscoveryService
    Properties:
      ServiceName: !Ref 'ServiceName'
      Tags: 
        - Key: Name
          Value: !Sub '${StackName} ${ServiceName}'  
      Cluster:
        Fn::ImportValue:
          !Join [':', [!Ref 'StackName', 'ClusterName']]         
      LaunchType: !Ref 'LaunchType'
      SchedulingStrategy: "REPLICA"
      # PlacementStrategies: 
      #   - Field: attribute:ecs.availability-zone
      #     Type: spread               
      ServiceRegistries:
        - RegistryArn: !GetAtt DiscoveryService.Arn
          #Port: !Ref 'ContainerPort'
          ContainerPort: !Ref 'ContainerPort'
          ContainerName: !Ref 'ServiceName'
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 30
      DesiredCount: !Ref 'DesiredCount'

      #IMP:: Only for awsvpc network mode
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: "DISABLED"
          SecurityGroups:
            - Fn::ImportValue:
                !Join [':', [!Ref 'StackName', 'ECSContainerSecurityGroup']]
          Subnets:
            - Fn::ImportValue:
                !Join [':', [!Ref 'StackName', 'PrivateSubnetOne']]
            - Fn::ImportValue:
                !Join [':', [!Ref 'StackName', 'PrivateSubnetTwo']] 

      TaskDefinition: !Ref 'TaskDefinition'
      LoadBalancers:
        - ContainerName: !Ref 'ServiceName'
          ContainerPort: !Ref 'ContainerPort'
          TargetGroupArn: !Ref 'TargetGroup'

  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 5
      MinCapacity: 0
      ResourceId: !Join
        - '/'
        - - service
          - Fn::ImportValue:
              !Join [':', [!Ref 'StackName', 'ClusterName']]
          - !GetAtt Service.Name      
      RoleARN: 
        Fn::ImportValue:
          !Join [':', [!Ref 'StackName', 'ECSServiceAutoScalingRole']]      
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  CPUUtilizationAutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Service.Name}-CPUUtilizationScaleUpPolicy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 300
        TargetValue: 100  

  MemoryUtilizationAutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Service}-MemoryUtilizationScaleUpPolicy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 300
        TargetValue: 95 

  # A target group. This is used for keeping track of all the tasks, and
  # what IP addresses / port numbers they have. You can query it yourself,
  # to use the addresses yourself, but most often this target group is just
  # connected to an application load balancer, or network load balancer, so
  # it can automatically distribute traffic across all the targets.
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: !Ref HealthPath
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 10
      TargetType: !Ref TargetType
      Name: !Sub "${StackName}-${ServiceName}"
      Port: !Ref 'ContainerPort'
      Protocol: HTTP
      UnhealthyThresholdCount: 10
      VpcId:
        Fn::ImportValue:
          !Join [':', [!Ref 'StackName', 'VPCId']]
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30          

  # Create a rule on the load balancer for routing traffic to the target group
  LoadBalancerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - TargetGroupArn: !Ref 'TargetGroup'
          Type: 'forward'
      Conditions:
        - Field: host-header
          Values: [!Ref 'HttpHostHeader']
      ListenerArn: !Ref HTTPSListener
      Priority: !Ref 'Priority'